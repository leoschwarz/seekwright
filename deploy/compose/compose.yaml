# The two-role deployment as a unit set. Steps and reasoning: docs/reference/deploying.md.
name: seekwright

services:
  search:
    # The published image, one tag per release: `docker compose pull` fetches it,
    # `up --build` builds the same image from this checkout instead.
    image: ghcr.io/leoschwarz/seekwright:${SEEKWRIGHT_TAG:-v0.1.0}
    build:
      context: ../..
      dockerfile: Containerfile
    command: ["--http", "--host", "0.0.0.0", "--allowed-host", "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8000"]
    restart: unless-stopped
    volumes:
      - ./search.toml:/etc/seekwright/config.toml:ro
    # The search role's keys; absent means the keyless pair. Never on the fetch role.
    env_file:
      - path: ./search.env
        required: false
    environment:
      - HTTP_PROXY=http://search-proxy:3128
      - HTTPS_PROXY=http://search-proxy:3128
      - NO_PROXY=127.0.0.1,localhost
    networks: [search-egress]
    depends_on: [search-proxy]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  fetch:
    image: ghcr.io/leoschwarz/seekwright:${SEEKWRIGHT_TAG:-v0.1.0}
    command: ["--http", "--host", "0.0.0.0", "--allowed-host", "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8001"]
    restart: unless-stopped
    volumes:
      - ./fetch.toml:/etc/seekwright/config.toml:ro
    environment:
      - HTTP_PROXY=http://fetch-proxy:3128
      - HTTPS_PROXY=http://fetch-proxy:3128
      - NO_PROXY=127.0.0.1,localhost
    networks: [fetch-egress]
    dns: [172.28.1.53]
    depends_on: [fetch-proxy, resolver]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  resolver:
    image: docker.io/coredns/coredns:1.11.3
    # The image has an empty CMD, so without this it reads /home/nonroot/Corefile and ignores the mount.
    command: ["-conf", "/etc/coredns/Corefile"]
    restart: unless-stopped
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      fetch-egress:
        ipv4_address: 172.28.1.53
      egress:

  search-proxy:
    # The _edge tag moves underneath its name; the digest pins the build (Squid 6.14) the ACL
    # syntax was verified against. Refresh deliberately: docker pull ubuntu/squid:6.6-24.04_edge
    # && docker image inspect --format '{{index .RepoDigests 0}}' ubuntu/squid:6.6-24.04_edge
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    restart: unless-stopped
    volumes:
      - ./squid/search-allow.conf:/etc/squid/squid.conf:ro
      - ./generated:/etc/squid/lists:ro
    networks: [search-egress, egress]

  fetch-proxy:
    # The _edge tag moves underneath its name; the digest pins the build (Squid 6.14) the ACL
    # syntax was verified against. Refresh deliberately: docker pull ubuntu/squid:6.6-24.04_edge
    # && docker image inspect --format '{{index .RepoDigests 0}}' ubuntu/squid:6.6-24.04_edge
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    restart: unless-stopped
    volumes:
      - ./squid/fetch-${EGRESS_FETCH_POLICY:-lenient}.conf:/etc/squid/squid.conf:ro
      - ./generated:/etc/squid/lists:ro
    networks: [fetch-egress, egress]

  search-ingress:
    # Docker maps no port for a container whose networks are all internal, so the listener is
    # published by a forwarder: it dials the role and nothing else, holds no key, no env and no
    # volume, and the role keeps no network of its own with a route out.
    image: docker.io/alpine/socat:1.8.1.3
    entrypoint: ["socat"]
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "TCP:search:8000"]
    restart: unless-stopped
    ports:
      - "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8000:8000"
    networks: [search-egress, ingress]
    depends_on: [search]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  fetch-ingress:
    image: docker.io/alpine/socat:1.8.1.3
    entrypoint: ["socat"]
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "TCP:fetch:8000"]
    restart: unless-stopped
    ports:
      - "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8001:8000"
    networks: [fetch-egress, ingress]
    depends_on: [fetch]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  search-egress:
    internal: true
  fetch-egress:
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24
  egress:
  ingress:
