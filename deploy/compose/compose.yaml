# The two-role deployment as a unit set. Role configs and reasoning: ocaml-docs/deploying.md.
#
# No proxy sits between these containers and the internet: the binary dials each
# endpoint directly and reads no HTTP_PROXY/HTTPS_PROXY/NO_PROXY. This bundle
# therefore does not enforce the sink deny list (`.webhook.site`, `.oast.pro` and
# the rest of egress/deny-hosts.txt) or the lenient-vs-strict fetch choice.
# deploy/compose/generated/ is the rendered host inventory to feed the host
# firewall or nftables ruleset that enforces them. What the app still enforces:
# Policy_net's refusal of private and link-local addresses, permitted_providers as
# the dispatch allow-list, and http/https as the only fetchable schemes.
name: seekwright

services:
  search:
    # The published image: the version tag is the pin, :latest moves with it.
    # `docker compose pull` fetches it; `up --build` builds the same image from
    # this checkout instead.
    image: ghcr.io/leoschwarz/seekwright:${SEEKWRIGHT_TAG:-0.1.1}
    build:
      context: ../..
      dockerfile: Containerfile.ocaml
      # The build stage refuses a version that is not dune-project's (version), so
      # a SEEKWRIGHT_TAG override has to name a release, not `latest`.
      args:
        SEEKWRIGHT_VERSION: "${SEEKWRIGHT_TAG:-0.1.1}"
    command: ["--http", "--host", "0.0.0.0", "--allowed-host", "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8000"]
    restart: unless-stopped
    volumes:
      - ./search.toml:/etc/seekwright/config.toml:ro
    # The search role's keys; absent means the keyless pair. Never on the fetch role.
    env_file:
      - path: ./search.env
        required: false
    ports:
      - "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8000:8000"
    networks: [search-net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  fetch:
    # The same image name as `search`, no build block of its own: the build above
    # tags it, so `up --build` compiles once and both services start from it.
    # No env_file here by design — the fetch role dispatches no provider.
    image: ghcr.io/leoschwarz/seekwright:${SEEKWRIGHT_TAG:-0.1.1}
    command: ["--http", "--host", "0.0.0.0", "--allowed-host", "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8001"]
    restart: unless-stopped
    volumes:
      - ./fetch.toml:/etc/seekwright/config.toml:ro
    ports:
      - "${SEEKWRIGHT_PUBLISH:-127.0.0.1}:8001:8000"
    networks: [fetch-net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  # One ordinary bridge per role: outbound NAT for the endpoints each dials, and
  # no path between the two roles.
  search-net:
  fetch-net:
