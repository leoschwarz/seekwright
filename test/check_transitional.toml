# The [--check] disclosure smoke: a config whose keys all load and validate,
# pointed at by SEEKWRIGHT_CONFIG in the [check_transitional] rule in [../test/
# dune]. Only names this port does not carry are enabled, so nothing is built
# and nothing is dialled; what the run does exercise is the honest disclosure:
# an unbuilt fetch primary and ladder and [fetch.allow_private_addresses] on,
# each marked "unsupported on this port" beside its row and collected in the
# aggregated list at the end — and the cache row, which since F7 answers with
# what the directory holds. [rm -rf] in the rule keeps that figure at zero.
[providers."exa:free"]
enabled = true

[fetch]
extractor = "stdlib"
primary = "jina"
fallback = ["jina"]
cache_dir = "check_cache"
allow_private_addresses = true
