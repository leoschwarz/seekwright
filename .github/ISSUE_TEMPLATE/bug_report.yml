name: Bug report
description: Something in seekwright does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **A security problem does not belong in this tracker.** API-key handling
        and the fetcher's guardrails are in scope for a private report — see
        `SECURITY.md` in the repository root for what is in scope and where to
        send it.

        Before filing, it is worth knowing what is a known non-feature rather
        than a bug: there is no search cache, the HTTP listener has no
        authentication, `robots.txt` is not consulted, and fetched text is
        untrusted by design. `ocaml-docs/privacy.md` records what lands on disk
        and when, and `ocaml-docs/divergences.md` records what a caller can see
        this binary do differently — no `--help` flag, no `--version` flag.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, including the exact error message or `notice` text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: What `README.md` or `ocaml-docs/` led you to expect.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `seekwright --check`
      description: >-
        Paste the whole report. It validates the config, prints the path it
        read, and lists the enabled, effective and built providers with their
        state and price, then the fetch stack and the cache. It never prints a
        key: a provider it cannot use is reported as having no API key. From a
        source checkout the binary is
        `_build/install/default/bin/seekwright`. It dials no provider;
        `--check --live` is the variant that probes them and can spend, so paste
        that only if you are willing to. If the server will not start at all,
        paste the startup refusal instead — it names the missing environment
        variable, never its value.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: >-
        The tool call or REST request you made, the provider you named, and the
        response's `notice` if it carried one. Redact the query text if it is
        sensitive — it is not needed to diagnose a transport or provider failure.
      placeholder: |
        search(query="...", provider="serper", max_results=5)
        -> the error text you got, plus the `notice` field if the response had one
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - MCP over stdio
        - MCP over streamable HTTP (--http)
        - REST (POST /api/v1/search, POST /api/v1/fetch)
        - The CLI (--check, --check --live, --metrics)
        - The container image
        - The test suite
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config and environment
      description: >-
        The config file path — `$SEEKWRIGHT_CONFIG` if you set it, otherwise
        `~/.config/seekwright/config.toml`; `--check` prints the one it read,
        and a mounted `/etc/seekwright/config.toml` is a different file. Then
        which providers you enabled and which `SEEKWRIGHT_*` variable names you
        set. Never paste the values.
      render: toml
      placeholder: |
        default_provider = "serper"

        [providers.serper]
        enabled = true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        There is no `--version` flag, so this is how you know the version
        yourself. Container: the tag you pulled, or `docker image inspect
        --format '{{index .Config.Labels "org.opencontainers.image.version"}}'`
        on it. Source build: `dune build version.txt && cat
        _build/default/version.txt`, with `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: How you run it
      description: >-
        The transport and the exact flags — e.g. `--http --host 127.0.0.1
        --port 8000`, or stdio with no flags — plus the OS and architecture. For
        a source build, the compiler `ocamlc -version` reports; for the
        container, the image and tag. Add the MCP client you mounted the server
        in if the problem is client-side.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Logs go to stderr. With `[logging] log_queries` and `log_content` off —
        the defaults — they carry no query text and no page content, so they are
        safe to paste. If you turned either on, redact first.
      render: shell
  - type: checkboxes
    id: secrets
    attributes:
      label: Before submitting
      options:
        - label: I have not pasted an API key or any other credential.
          required: true
