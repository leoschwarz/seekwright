name: publish

# A release is a tag push: that tag becomes the ghcr.io image for its version and
# :latest. The image is the artifact; this file writes no release asset.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Build, scan, push and smoke one image, and the build is the long pole.
    # Bounded, or a hung step inherits the runner default.
    timeout-minutes: 60
    # The ghcr.io push spends the automatic token and checkout spends contents:
    # naming any scope here zeroes the ones it does not name.
    permissions:
      contents: read
      packages: write
    # The runner exposes that token as a workflow context only: it sets no
    # GITHUB_TOKEN variable in the environment, so this is the one name the login
    # below reads.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # The tag/main guard below needs `main` to be fetchable, so no shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag has to name main's head, or CI never ran on what gets published.
      - name: the tag must name the commit main names
        run: |
          set -eu
          git fetch -q --depth 1 origin main
          MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$MAIN" != "$GITHUB_SHA" ]; then
            echo "FAIL: ${GITHUB_REF_NAME} names ${GITHUB_SHA}, but main names ${MAIN}: this run would publish a commit main does not name, under a release name, on a tree CI never ran on."
            echo "FAIL: the fix is to move or re-cut ${GITHUB_REF_NAME} from ${GITHUB_SHA} onto ${MAIN}, main's head, and re-run this tag; nothing was pushed."
            exit 1
          fi
          echo "TAG NAMES MAIN HEAD: ${GITHUB_REF_NAME} at ${GITHUB_SHA}"

      # dune-project owns the version, and this runner has no dune, so it is read
      # with the expression the Containerfile's build-stage guard compares the
      # --build-arg against: one field, two readers, no copy. A tag push is the
      # release path, so the ref has to be `v` plus that version.
      - name: read the version and refuse a tag that does not name it
        id: version
        run: |
          set -eu
          version=$(sed -n 's/^(version \(.*\))/\1/p' dune-project)
          test -n "$version" || { echo 'dune-project carries no (version …)'; exit 1; }
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "FAIL: ${GITHUB_REF_NAME} is a tag push, so this is the release path, and the release name is its version: ${GITHUB_REF_NAME} is not v${version}, the version dune-project carries."
            echo "FAIL: the fix is to cut the tag that matches (version) in dune-project — v${version} — or to bump that version and re-tag. Nothing was built or pushed."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}:${version}"
          echo "release ${GITHUB_REF_NAME}: version ${version}, image ${image}"
          {
            echo "version=$version"
            echo "image=$image"
            echo "latest=ghcr.io/${GITHUB_REPOSITORY}:latest"
          } >> "$GITHUB_OUTPUT"

      # The Containerfile compares the --build-arg against the dune-project it
      # reads, so a wrong version fails the build rather than shipping a
      # mislabelled image. The revision label is what the smoke reads back off
      # the pushed tag.
      - name: build the image
        run: |
          set -eu
          DOCKER_BUILDKIT=1 docker build \
            --file Containerfile.ocaml \
            --build-arg SEEKWRIGHT_VERSION="${{ steps.version.outputs.version }}" \
            --build-arg SEEKWRIGHT_REVISION="$GITHUB_SHA" \
            --tag "${{ steps.version.outputs.image }}" \
            --tag "${{ steps.version.outputs.latest }}" .

      # The scan gate on the bytes this run pushes: ignore-unfixed stays off, so
      # an unfixed CRITICAL/HIGH fails the release instead of riding along under a
      # published tag. The fix is a base-pin bump or a lock refresh, re-cut as the
      # same version.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.version.outputs.image }}
          scanners: vuln
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: "false"

      # Both tags are pushed from the one local image, so :latest and the version
      # tag are the same manifest.
      - name: push the image
        run: |
          set -eu
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${{ steps.version.outputs.image }}"
          docker push "${{ steps.version.outputs.latest }}"
          echo "PUSHED ${{ steps.version.outputs.image }} and ${{ steps.version.outputs.latest }}"

      # The pull, not the local build: what a deployment resolves is the pushed
      # tag, so a lost credential, a package the runner cannot read or a manifest
      # that never landed shows up here. The two labels prove the pulled bytes are
      # this commit and this version; stdio tools/list proves the three tools are
      # registered; /healthz proves the HTTP path serves.
      - name: smoke the pushed image
        run: |
          set -eu
          IMAGE="${{ steps.version.outputs.image }}"
          docker pull "$IMAGE"
          revision=$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")
          test "$revision" = "$GITHUB_SHA" || {
            echo "FAIL: $IMAGE carries org.opencontainers.image.revision=$revision, not $GITHUB_SHA, the commit this run built from."
            exit 1
          }
          version=$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")
          test "$version" = "${{ steps.version.outputs.version }}" || {
            echo "FAIL: $IMAGE carries org.opencontainers.image.version=$version, not the version its tag names."
            exit 1
          }
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run -i --rm "$IMAGE" | tr -d '\r')
          echo "$out" | grep -q '"serverInfo"'
          for tool in search fetch answer; do
            echo "$out" | grep -q "\"name\":\"$tool\"" || { echo "missing tool $tool"; exit 1; }
          done
          container=$(docker run -d -p 127.0.0.1:8000:8000 "$IMAGE" --http --host 0.0.0.0)
          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' http://127.0.0.1:8000/healthz) || code=000
            test "$code" = 200 && break
            sleep 1
          done
          docker logs "$container"
          cat /tmp/healthz.json
          test "$code" = 200
          grep -q '"status":"ok"' /tmp/healthz.json
          docker stop -t 20 "$container" > /dev/null
          docker rm "$container" > /dev/null
          # After the pull, so the digest is the registry's and not an empty list:
          # this line is what an operator pins.
          docker image inspect --format 'digest={{index .RepoDigests 0}} size={{.Size}}' "$IMAGE"
          echo "PUSHED IMAGE OK: $IMAGE"
